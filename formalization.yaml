version: v0.4
project:
  name: A positive constant-recursive sequence with nonquasipolynomial power ranks
  description: >-
    An explicit positive integer sequence has recurrence rank 13. The complete
    minimal characteristic polynomial and exact rank are given for every
    termwise power. The power ranks are not eventually quasipolynomial.
    A positive companion family gives infinitely many different power-rank
    profiles at each fixed initial rank at least three.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
