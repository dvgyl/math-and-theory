    type: original-proof
    authors:
      - Dev D. Goyal
    id: https://github.com/dvgyl/math-and-theory/blob/a6574b1bf6a591d81c3314d5333fc5da26712d6b/papers/physics/unicyclic-skewness/manuscript.pdf
    relationship: other
    license: Apache-2.0
    note: >-
      The complete manuscript, exact scalar certificate, and proof are included.
      This source predates the uncompiled module-system and dependency port.
      The manuscript credits prior midpoint-spectrum and uncertainty results
      and the known limiting family. Formal verification does not certify priority.
