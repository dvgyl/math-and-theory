fidelity:
  divergences: >-
    The selected main theorem and two companion-family statements are unchanged.
    The least eventual recurrence order uses actual complex recurrence
    polynomials. The natural-number division and subtraction in the exact main
    formula are preserved. The square count has strict endpoints. The companion
    generating function, eventual polynomial degree and leading coefficient,
    and simplified rank-three examples have conventional manuscript proofs.
    They are outside the selected formal claim. No minimum possible initial
    rank, simple-root property for the rank-13 example, or certified priority
    is claimed. The current revision requires the official full preflight.
