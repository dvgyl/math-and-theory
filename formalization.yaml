      tool_setup: Prepared this uncompiled candidate from the recorded source.
  notes: >-
    This release was prepared through fully autonomous agentic research. AI agents
    audited the supplied proof sources and reran earlier checks. The original
    model history is not documented in the source. No human proof review, external
    peer review, or literature-priority determination is claimed. Dev D. Goyal
    is responsible for publication. No fresh compiler check is claimed here.
fidelity:
  divergences: >-
    No mathematical change is intended for the selected concrete counterexample.
    Only the multiplier update is enlarged; the other overrelaxed ADMM convention
    also changes a primal argument and is outside this statement. The alternative
    finite-objective trajectory remains in Solution. Its convexity, strong
    convexity, C2 regularity, and Lipschitz-gradient properties use conventional
    manuscript proofs and are not checked by the supplied Lean modules. The port
    has not been compiled. No proof mathematics was changed to force acceptance.
review:
