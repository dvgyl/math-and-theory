version: v0.4
project:
  name: The unrestricted four-qubit Higuchi–Sudbery entropy bound
  description: >-
    Every normalized vector of sixteen complex amplitudes has average entropy
    of its three balanced two-qubit marginals at most log(2) + log(3)/2.
    The bound is attained. No condition on one-qubit marginals is imposed.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
