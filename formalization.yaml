version: v0.4
project:
  name: The exact asymmetric Merino–Welsh region for finite matroids
  description: >-
    The universal Tutte product inequality for finite matroids without loops or
    coloops holds exactly on an explicit region in the nonnegative quadrant.
    The region includes two scalar families for every natural number at least two.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
