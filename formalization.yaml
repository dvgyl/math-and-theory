status:
  scope: >-
    The selected statements are the unrestricted upper bound and its exact global
    maximum. The definitions use the actual balanced reduced matrices and their
    Hermitian eigenvalues. Entropy uses natural logarithms and the zero-eigenvalue
    convention supplied by Real.log 0 = 0. The complete proof and sum-of-squares
    certificate are included. Deliberate Challenge holes are not part of the Solution.
  sorry_count: 0
  sorry_in_definitions: 0
