status:
  scope: >-
    The current revision requires the official full preflight. Complete source proofs are supplied.
    Recurrence polynomials are monic complex polynomials with nonzero constant
    coefficient. They act on the actual sequence shift and annihilate a tail.
    The constructed sequences have minimal characteristic polynomials, so the
    recurrence rank is their least admissible degree. The main rank formula
    includes every natural power M, including zero. Its square-root error bound
    applies for M >= 1. The companion statements include all initial ranks r >= 3,
    all parameters d >= 2, every natural power, and existence of the required
    distinct odd primes. The listed axioms are expected and require fresh
    transitive-axiom checks. The proof-status counts exclude the three deliberate
    Challenge theorem holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
