status:
  scope: >-
    This is an uncompiled candidate for Lean 4.35.0 and the pinned Mathlib revision.
    No successful port verification is claimed. The selected statements concern
    actual finite-matrix derivatives and local branch existence. Challenge imports
    only Mathlib and copies the exact ring matrix, rate matrix, edge tilt, and
    tilted characteristic definitions. No spectral, stationary, variance, or
    uncertainty conclusion is a hypothesis. Its two deliberate theorem holes
    are separate from Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
automation:
  methods:
    - method: autonomous
      tool_setup: Research, proofs, formalizations, corrections, and manuscript preparation.
    - method: agent
      framework: Codex
      tool_setup: Prepared this uncompiled candidate from the recorded source.
  notes: >-
    This work is fully autonomous agentic research. AI systems generated and
    developed the research, proofs, formalizations, corrections, and manuscript.
    Dev D. Goyal is responsible for publication. No expert human validation or
    peer review is claimed. The source does not identify the original model history.
fidelity:
  divergences: >-
    The selected statements are finite-matrix theorems. The identification of
    their derivative ratio with long-time stochastic cumulants uses a conventional
    spectral-projection proof in the manuscript. Universal sharpness uses a
    conventional limit through positive rates and increasing ring size. Lean
    does not construct a stochastic sample-path probability space or a separate
    optimizing-sequence theorem. The ratio is not standardized skewness. Equal
    forward and reverse rate products are excluded because the mean is zero.
    Separate one-state and two-state conventions remain in the proof package.
    No mathematical proof body changed during this uncompiled port.
review:
  status: Not peer reviewed. The candidate is uncompiled.
