      module: Solution
      status: uncompiled
    - source: Nonattainment on the interior flat branch
      lean: Milne.no_maximizer_on_flat_branch
      module: Solution
      status: uncompiled
    - source: Attained endpoint at centre one
      lean: Milne.steeringEndpoint_isGreatest
      module: Solution
      status: uncompiled
    - source: Threshold for the specified three-setting expression
      lean: Milne.three_setting_violation_possible_iff
      module: Solution
      status: uncompiled
