version: v0.4
project:
  name: Exact three-setting correlation bounds at fixed steering centre
  description: >-
    The explicit piecewise envelope is the exact least upper bound of actual
    squared Pauli correlation values over two-qubit density matrices at each
    computed steering centre c in [0,1]. It is attained for c below 2/3, is not
    attained on [2/3,1), and is attained at c=1. A value above one exists exactly
    when c is below 2/3. This threshold concerns the specified expression.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
classification:
  arxiv:
    - quant-ph
  msc2020:
    - 81P45
    - 15A42
sources:
  - title: Exact three-setting correlation bounds at fixed steering centre
    type: original-proof
    authors:
      - Dev D. Goyal
    id: https://github.com/dvgyl/math-and-theory/blob/a6574b1bf6a591d81c3314d5333fc5da26712d6b/papers/physics/steering-bounds/paper/steering_bounds.pdf
    relationship: other
    license: Apache-2.0
    note: >-
      The complete manuscript and proof are included. This source predates the
      module-system and dependency port. The manuscript credits Milne
      and collaborators, Ducuara and collaborators, Bravyi, and Costa and Angelo.
      Canonical filtering, canonical spectral bounds, and the maximally obese
      witness family are credited prior ingredients. Priority is not certified.
status:
  scope: >-
    A local Lean 4.35.0 source replay compiled all 18 proof modules and Solution
    with trust level zero. The selected and square-root support declarations
    passed a separate permitted-axiom audit. Full preflight and Comparator
    checks remain required. Challenge imports only Mathlib.
    It copies the exact density, partial trace, Pauli correlation, positive
    canonical filter, computed centre, piecewise envelope, and spectrum definitions.
    A short partial-trace positivity lemma supplies the proof argument used by
    the actual positive square root. No correlation inequality is assumed.
    The five deliberate theorem holes are separate from Solution.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
automation:
  methods:
    - method: autonomous
      tool_setup: Mathematical arguments and formal proofs.
    - method: agent
      framework: Codex
      tool_setup: Mathematical checks, verification software, manuscript and candidate preparation.
  notes: >-
    This work is fully autonomous agentic research. Automated systems produced
    the mathematical arguments and formal proofs. Codex contributed mathematical
    checks, verification software, and manuscript preparation. Dev D. Goyal is
    responsible for publication. No expert validation or peer review is claimed.
    The source disclosure does not identify the original model history.
fidelity:
  divergences: >-
    The selected statements are actual finite-matrix theorems. Their CJWR
    measurement optimization and steering-ellipsoid interpretation use credited
    external physics correspondences. Lean does not optimize measurement settings,
    define local hidden-state models, or characterize all steerable states. The
    centre includes the singular marginal case. The related fully entangled
    fraction maximum remains in the proof package but is not a separate selected
    Challenge target. The square-root API now uses CFC.sqrt on the same Bob
    marginal sum. Mechanical API repairs preserve the selected theorem headers
    and domains. The local direct Lean replay passed. Full preflight is pending.
review:
  status: Not peer reviewed. Locally compiled; full preflight is pending.
