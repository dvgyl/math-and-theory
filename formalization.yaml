version: v0.4
project:
  name: A sharp universal skewness bound for unicyclic currents
  description: >-
    Every local C3 zero-eigenvalue branch of the actual marked-edge tilted
    matrix has nonzero first derivative and third-to-first derivative ratio
    in [-1/16,1]. A branch exists from the positive rates alone. The finite
    cycle has at least three states and unequal forward and reverse rate products.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
classification:
  arxiv:
    - cond-mat.stat-mech
    - math-ph
  msc2020:
    - 60J27
    - 82C31
