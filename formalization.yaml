  notes: >-
    The authors checked the proofs to the best of their mathematical abilities.
    This check is not expert validation or peer review. Dev D. Goyal is responsible
    for publication. The submission package was prepared autonomously in Codex.
    The current proof, Solution, Audit, and Challenge pass local Lean compilation.
    Full Palomar comparison and independent kernel checks remain pending.
fidelity:
  divergences: >-
    The formal operational result uses the displayed diagonal states in finite
    complex Hilbert space. The bipartite map acts by separate basis permutations
    on the two parties. Arbitrary changes from an external basis to Schmidt form
    are not separately formalized. The bound is uniform over p for fixed m.
    It retains the full dependence on m and L. The dimension sequence is
    n = 2^(4L), not every positive integer dimension. Fidelity is root fidelity,
    not its square. Optimal constants, gate complexity, and exact catalyst return
    are not claimed.
