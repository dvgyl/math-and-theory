fidelity:
  divergences: >-
    The wrapper statements replace references to channel constructors by explicit
    channel existence and the exact law for every channel with the specified
    map. They retain the actual coefficient definitions and full parameter
    domains. The original endpoint theorems remain in the complete Solution.
    The Challenge uses a direct complete-positivity proof that the amplified
    density difference is Hermitian. This changes only a proof argument in
    finalGap. Lean proof irrelevance should make the definitions agree, but
    the comparator has not checked this. No general attainment claim is added.
    Unital-qubit normal-form existence, erasure simulation, and ensemble-guessing
    consequences use conventional manuscript arguments and are outside the Challenge.
review:
  status: Not peer reviewed. The changed package has not been compiled.
alignment:
