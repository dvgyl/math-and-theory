version: v0.4
project:
  name: A rational five-cycle for two-block ADMM with multiplier step below two
  description: >-
    An exact nonconstant five-cycle of projection-based classical two-block ADMM
    has multiplier step 199/100 and penalty one. Both actual convex hulls are
    compact and contain zero. Each primal update is the unique global projection.
    The squared primal residual is at least 500000 at every iteration and does
    not tend to zero. The same instance has a zero fixed trajectory.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
classification:
  arxiv:
    - math.OC
  msc2020:
    - 90C25
    - 90C30
sources:
  - title: A five-cycle of classical two-block ADMM
    type: original-proof
    authors:
      - Dev D. Goyal
    id: https://github.com/dvgyl/math-and-theory/blob/a6574b1bf6a591d81c3314d5333fc5da26712d6b/papers/mathematics/admm-counterexample/paper/admm_counterexample.pdf
    relationship: other
    license: Apache-2.0
    note: >-
      The complete manuscript and proof are included. The linked source predates
      the uncompiled module-system and dependency port. It does not certify the
      changed source bytes. The manuscript credits prior ADMM convergence work.
      No exact optimal convergence threshold or literature priority is claimed.
status:
  scope: >-
    This is an uncompiled candidate for Lean 4.35.0 and the pinned Mathlib revision.
    No successful port verification is claimed. Challenge imports only Mathlib.
    It copies the exact four-coordinate vectors, rational step, convex hulls,
    unique projection predicate, and infinite ADMM trajectory definitions.
    The selected theorem has no projection inequalities or convergence claims
    as hypotheses. Its sole deliberate theorem hole is separate from Solution.
    Zero lies in both sets and is therefore an optimizer for their indicator
    feasibility objective. The theorem also checks the zero fixed trajectory.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
