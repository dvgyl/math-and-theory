status:
  scope: >-
    Complete source proofs are supplied. The proof, Solution, and Audit pass local compilation with warnings treated as errors and trust level zero. Challenge compiles with its two deliberate theorem placeholders. Full Palomar comparison and independent kernel checks are pending.
    The two selected statements quantify over every finite index type J with
    decidable equality, every chosen j_0 in J, every nonnegative p with sum one,
    and every L >= 1. Here m is the cardinality of J, including zero-probability
    entries. The catalyst coefficients depend only on L. The permutation can
    depend on the target. Each party's combined register has dimension mn.
    Both compared states have norm one. Root fidelity is the norm of their
    complex inner product; root infidelity is 1 minus root fidelity.
    The local audit reports only the listed permitted axioms. Full preflight must
    independently check their actual transitive use. The proof-status counts exclude the
    two deliberate Challenge holes.
  sorry_count: 0
  sorry_in_definitions: 0
