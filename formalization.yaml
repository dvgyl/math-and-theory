version: v0.4
project:
  name: Exact conditional contraction for Pauli channels and depolarization in every dimension
  description: >-
    Exact conditional hockey-stick contraction coefficients for every stochastic
    Pauli qubit channel and the full signed physical depolarizing interval in
    every dimension at least two. The coefficient includes arbitrary finite
    quantum references and actual density-state ratios with positive denominator.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
classification:
  arxiv:
    - quant-ph
    - math-ph
  msc2020:
    - 81P45
    - 81P40
    - 47A63
sources:
  - title: Exact conditional contraction for Pauli channels and depolarization in every dimension
    type: original-proof
    authors:
      - Dev D. Goyal
    id: https://github.com/dvgyl/math-and-theory/blob/a6574b1bf6a591d81c3314d5333fc5da26712d6b/papers/physics/quantum-exact-contraction/quantum_exact_contraction.pdf
    relationship: other
    license: Apache-2.0
    note: >-
      The complete original proof and manuscript are included. The manuscript
      preserves the original research version and its historical verification
      claims. The changed package passed local checks. A fresh sandboxed
      Palomar preflight is required for the published commit.
  - title: Conditional contraction coefficients and their applications to quantum networks
    type: paper
    authors:
      - C. Hirche
      - I. George
      - T. Nuradha
      - M. M. Wilde
    id: https://arxiv.org/abs/2608.27171v1
    relationship: background
    author_endorsement: not-contacted
    note: The manuscript gives the other prior channel, entropy, and frame references.
status:
  scope: >-
    Both result families are retained. The Challenge states existence of each
    actual channel and the exact formula for every channel with that explicit
    map. All finite quantum references, unequal reference marginals, gamma at
    least one, zero weights, ties, and closed physical endpoints are included.
    The complete package passed local Lake builds, exact Comparator comparison,
    permitted-axiom checks, and the default Lean kernel on 2026-10-29.
    The exported comparison ran without a sandbox. A full sandboxed preflight
    of the published commit remains required.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
