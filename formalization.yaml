      lean: PalomarQuantum.every_pauli_channel
      module: Solution
      status: Locally compiled; exact Comparator and default Lean kernel passed.
    - source: Actual depolarizing channels on the full signed physical interval in every dimension
      lean: PalomarQuantum.actual_full_channel
      module: Solution
      status: Locally compiled; exact Comparator and default Lean kernel passed.
