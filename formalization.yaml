version: v0.4
project:
  name: Universal entanglement embezzlement with inverse-quadratic logarithmic infidelity
  description: >-
    A catalyst family independent of the target gives root fidelity at least
    1 - 125m/L^2 for every finite Schmidt probability vector on m entries and
    every integer L >= 1. The catalyst has local dimension n = 2^(4L).
    The equivalent error bound is 2000m/(log_2 n)^2. The formal statements
    use normalized diagonal states and separate local basis permutations
    in finite complex Hilbert space.
  authors:
    - Dev D. Goyal
  responsible_maintainers:
    - Dev D. Goyal
  license: Apache-2.0
