name = "motzkinForcing"
version = "1.0.0"
defaultTargets = ["MotzkinForcing"]
moreLeanArgs = ["-j1", "-DwarningAsError=true"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[lean_lib]]
name = "MotzkinForcing"
srcDir = "src"
roots = ["CompleteAudit"]
globs = ["Certificates", "Algebra", "Invariant", "Growth", "Rectangle", "Corner", "Forcing", "Scaling", "StatementAudit", "CompleteAudit"]
