name = "powerRankComplete"
version = "1.0.0"
defaultTargets = ["PowerRankComplete"]
moreLeanArgs = ["-j1", "-M4096", "-DwarningAsError=true"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "PowerRankComplete"
srcDir = "src"
roots = ["CompleteAudit"]
globs = ["RankEngine", "PolynomialDifference", "SingleComponent", "MixedComponents", "RankPrinciple", "MainSequence", "SequenceSemantics", "MainProperties", "BivariateExpansion", "KrawtchoukCoefficients", "LayerDegrees", "BivariateCoefficients", "GeneratorReconstruction", "LayerIdentification", "GeneratorEvaluation", "ZeroComponents", "LayerSupport", "LayerMultiplicity", "PowerBases", "MainPowers", "RankBaseline", "SquareSolutions", "SquareCounting", "LatticeCount", "SquareEstimate", "Nonquasipolynomial", "SquareFloor", "IntegralFields", "MainTheorem", "CompanionCompositions", "CompanionBases", "CompanionExpansion", "CompanionFamily", "CompanionExistence", "CompleteAudit"]
