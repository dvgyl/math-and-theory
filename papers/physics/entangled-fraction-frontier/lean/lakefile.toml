name = "milne_research"
version = "1.0.0"
defaultTargets = ["MilneResearch"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "81a5d257c8e410db227a6665ed08f64fea08e997"

# Every source module is a library root. The upload's configuration listed only
# three roots, which Lake 4.32 rejects ("unknown module prefix") for the imported
# modules MarginalRank and NilpotentTensor.
[[lean_lib]]
name = "MilneResearch"
roots = ["AllProofs", "OptimizerComplementarity", "MarginalRank", "RectangularOptimizerRank", "NilpotentTensor", "NilpotentState"]

# Whole-project axiom audit; build it with `lake build ProjectAxiomAudit`.
[[lean_lib]]
name = "ProjectAxiomAudit"
