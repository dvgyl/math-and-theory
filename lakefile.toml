name = "unicyclicSkewness"
version = "1.0.0"
defaultTargets = ["UnicyclicProofs"]
moreLeanArgs = ["-j1", "--trust=0"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "56a005855ea17e0b0958f73ec801ae140b0a1679"

[[lean_lib]]
name = "UnicyclicProofs"
srcDir = "proof"
roots = [
  "ActualCycleBound",
  "AdjugateJets",
  "AllResults",
  "BranchCumulants",
  "CumulantAlgebra",
  "CyclicConstruction",
  "CyclicDeterminant",
  "CyclicMultiTilt",
  "CyclicPoisson",
  "CyclicRateBridge",
  "CyclicResidualJets",
  "FiniteTUR",
  "HermitianShift",
  "ImplicitCumulants",
  "ImplicitLocal",
  "LogRelaxation",
  "PoissonWinding",
  "PolynomialBranch",
  "PositiveRateMatrices",
  "PositiveRateSpectrum",
  "ProductCoefficients",
  "RateJets",
  "RateReversal",
  "RateTiltedAction",
  "RationalReduction",
  "ResidualCumulants",
  "ScalarCertificate",
  "SimplexMoments",
  "SpectralCoefficients",
  "SpectralMomentBound",
  "SpectralPolynomialBound",
  "TwoStateSkewness",
  "TwoStateWinding",
  "WindingSkewness",
]
globs = ["AllResults"]

[[lean_lib]]
name = "Challenge"

[[lean_lib]]
name = "Solution"
