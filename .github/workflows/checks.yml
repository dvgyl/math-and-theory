name: Source, manuscripts, and Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # Let long proof builds finish; newer pushes queue instead of restarting them.
  cancel-in-progress: false

jobs:
  source:
    name: Source and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Check source, hashes, and metadata
        run: |
          python verification/check_repository.py
          python verification/check_embedded_packages.py --arithmetic
          python verification/verify_hashes.py
          python verification/validate_metadata.py
          python verification/validate_citations.py
          python lean/scripts/check-lean-sources.py
          python verification/check_gyires_certificates.py
          python verification/check_gyires_packages.py
          python papers/physics/unicyclic-skewness/check_certificate.py
      - name: Check certificate failures and publication boundaries
        run: |
          python -m unittest discover -s verification -p 'test_*.py'
          python papers/theoretical-computer-science/readk-covariance/scripts/test_verifiers.py
          python papers/physics/thermal-kurtosis-counterexample/test_verifiers.py

  manuscripts:
    name: Manuscript builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c
        with:
          tectonic-version: '0.17.0'
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils latexmk texlive-latex-extra texlive-fonts-recommended texlive-science
      - name: Build each manuscript and compare its text with the committed PDF
        run: python3 verification/check_manuscripts.py

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          build-args: MathAndTheory Solutions Challenges
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check the stated types and permitted axioms
        working-directory: lean
        run: lake env lean Audit.lean

  readk-lean-419:
    name: Read-k Lean 4.19 build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Copy the unchanged release package
        run: |
          mkdir -p .ci-work
          cp -R papers/theoretical-computer-science/readk-covariance .ci-work/readk-covariance
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .ci-work/readk-covariance
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check dependencies, compile proofs, and check axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/check_ci_workcopy.py readk papers/theoretical-computer-science/readk-covariance .ci-work/readk-covariance
          (cd .ci-work/readk-covariance && bash verify.sh)
          python3 .ci-work/readk-covariance/scripts/test_verifiers.py
          python3 verification/check_ci_workcopy.py readk papers/theoretical-computer-science/readk-covariance .ci-work/readk-covariance

  thermal-lean-419:
    name: Thermal Lean 4.19 build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: leanprover-community/mathlib4
          ref: c44e0c8ee63ca166450922a373c7409c5d26b00b
          path: .ci-work/mathlib4
          persist-credentials: false
      - name: Copy the unchanged release package
        run: cp -R papers/physics/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .ci-work/mathlib4
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Get the cache for the proof imports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t imports < <(python3 - <<'PY'
          from pathlib import Path
          source = Path('.ci-work/thermal-kurtosis-counterexample/ThermalKurtosis.lean').read_text()
          for line in source.splitlines():
              if line.startswith('import Mathlib.'):
                  print(line.removeprefix('import ').replace('.', '/') + '.lean')
          PY
          )
          test "${#imports[@]}" -eq 20
          (cd .ci-work/mathlib4 && lake exe cache get "${imports[@]}")
      - name: Compile, check exact arithmetic, and check axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/check_ci_workcopy.py thermal papers/physics/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample
          bash .ci-work/thermal-kurtosis-counterexample/verify.sh "$PWD/.ci-work/mathlib4" 2>&1 | tee "$RUNNER_TEMP/thermal-verify.log"
          python3 verification/check_embedded_packages.py --thermal-log "$RUNNER_TEMP/thermal-verify.log"
          python3 .ci-work/thermal-kurtosis-counterexample/test_verifiers.py
          python3 verification/check_ci_workcopy.py thermal papers/physics/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample

  study-proofs:
    name: Study proof — ${{ matrix.study }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.study == 'higuchi-sudbery' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - study: sharp-eighth
            root: papers/mathematics/sharp-eighth
          - study: universal-embezzlement
            root: papers/physics/universal-embezzlement
          - study: galvin-zhang
            root: papers/mathematics/galvin-zhang
          - study: asymmetric-tutte
            root: papers/mathematics/asymmetric-tutte
          - study: higuchi-sudbery
            root: papers/physics/higuchi-sudbery
          - study: quartic-rankings
            root: papers/mathematics/quartic-rankings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: ${{ matrix.root }}
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check all requested theorem reports
        env:
          STUDY_NAME: ${{ matrix.study }}
          LEAN_NUM_THREADS: '1'
        run: |
          python3 verification/run_study_audit.py "$STUDY_NAME" "$RUNNER_TEMP/study-audit.txt"
          if [ "$STUDY_NAME" = "higuchi-sudbery" ]; then
            python3 papers/physics/higuchi-sudbery/tools/audit_sos.py
          fi
          git diff --exit-code


  gyires-rank-two:
    name: Gyires rank-two Lean proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: papers/mathematics/gyires/formalization/rank-two
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Compile all sources and check the final theorem
        working-directory: papers/mathematics/gyires/formalization/rank-two
        run: |
          python3 check_package.py
          # Check the audit wrapper's paths and parser before the long source build.
          python3 ../rank-two-eight-audit/check_audit.py "$GITHUB_WORKSPACE/verification/records/gyires-rank-two-eight-scoped.log"
          python3 -B test_verify.py
          python3 verify.py
          rank_lean="$(elan which lean)"
          rank_dependencies="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$PWD/.verification/build:$rank_dependencies" "$rank_lean" \
            --trust=0 -j1 -M8192 -DwarningAsError=true -R ../rank-two-eight-audit \
            ../rank-two-eight-audit/RankTwoEightScopedAudit.lean \
            > ../rank-two-eight-audit/audit.log
          python3 ../rank-two-eight-audit/check_audit.py ../rank-two-eight-audit/audit.log
          git diff --exit-code

  completed-portable-proofs:
    name: Completed proof package (${{ matrix.package }})
    runs-on: ubuntu-24.04
    # The ADMM certificates compile 168 modules one at a time; the Nesterov
    # verifier replays every imported proof at each of its 56 modules.
    timeout-minutes: ${{ matrix.package == 'admm-multiplier-step' && 180 || matrix.package == 'nesterov-subcritical' && 120 || 60 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - package: quantum-exact-contraction
            root: papers/physics/quantum-exact-contraction
            project: .
          - package: power-rank
            root: papers/mathematics/power-rank
            project: formalization
          - package: graph-roots
            root: papers/mathematics/graph-roots
            project: formalization
          - package: motzkin-bounded-forcing
            root: papers/mathematics/motzkin/bounded-forcing
            project: formalization
          - package: admm-counterexample
            root: papers/mathematics/admm-counterexample
            project: .
          - package: steering-bounds
            root: papers/physics/steering-bounds
            project: .
          - package: strong-gradient
            root: papers/mathematics/strong-gradient
            project: lean
          - package: unicyclic-skewness
            root: papers/physics/unicyclic-skewness
            project: proof
          - package: projection-amgm
            root: papers/mathematics/projection-amgm
            project: .
          - package: fidelity-three-state
            root: papers/physics/fidelity-three-state
            project: .
          - package: admm-multiplier-step
            root: papers/mathematics/admm-multiplier-step
            project: lean
          - package: chambolle-pock-cycles
            root: papers/mathematics/chambolle-pock-cycles
            project: lean
          - package: nesterov-subcritical
            root: papers/mathematics/nesterov-subcritical
            project: lean
          - package: critical-hardcore
            root: papers/theoretical-computer-science/critical-hardcore
            project: lean
          - package: upb-tensor-rank
            root: papers/physics/upb-tensor-rank
            project: lean
          - package: binary-spectral-tile
            root: papers/mathematics/binary-spectral-tile
            project: lean
          - package: keller-klein
            root: papers/mathematics/keller-klein
            project: lean
          - package: unit-squareclasses
            root: papers/mathematics/unit-squareclasses
            project: lean
          - package: artin-schreier-depth
            root: papers/mathematics/artin-schreier-depth
            project: lean
          - package: upper-ppt-hierarchy
            root: papers/physics/upper-ppt-hierarchy
            project: lean
          - package: matrix-pencil-completion
            root: papers/mathematics/matrix-pencil-completion
            project: lean_p1_converse
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Copy the immutable public package
        run: |
          mkdir -p .ci-work
          cp -R "${{ matrix.root }}" .ci-work/${{ matrix.package }}
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .ci-work/${{ matrix.package }}/${{ matrix.project }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Compile all package sources and audit theorem dependencies
        working-directory: .ci-work/${{ matrix.package }}/${{ matrix.project }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ matrix.package }}' == 'quantum-exact-contraction' ]]; then
            python3 test_verifier.py
            python3 verify.py
          elif [[ '${{ matrix.package }}' == 'steering-bounds' ]]; then
            ulimit -v 8388608
            python3 scripts/verify.py --serial
          elif [[ '${{ matrix.package }}' == 'strong-gradient' ]]; then
            python3 verify.py --lean "$(lean --print-prefix)/bin/lean" --mathlib .lake/packages/mathlib --output "${RUNNER_TEMP}/gradient-source-verification" --timeout 600
          elif [[ '${{ matrix.package }}' == 'unicyclic-skewness' ]]; then
            python3 ../verify.py --mathlib .lake/packages/mathlib --lean-bin "$(lean --print-prefix)/bin" --output "${RUNNER_TEMP}/unicyclic-source-verification" --timeout 600
          elif [[ '${{ matrix.package }}' == 'projection-amgm' ]]; then
            sh verify.sh
          elif [[ '${{ matrix.package }}' == 'fidelity-three-state' ]]; then
            python3 verify.py --output "${RUNNER_TEMP}/fidelity-source-verification.json" --log-dir "${RUNNER_TEMP}/fidelity-source-logs" --timeout 1800
          elif [[ '${{ matrix.package }}' == 'admm-multiplier-step' ]]; then
            python3 ../verify_lean.py --dependency-project . --output-dir "${RUNNER_TEMP}/admm-multiplier-step-verification"
          elif [[ '${{ matrix.package }}' == 'nesterov-subcritical' ]]; then
            python3 verify_release.py --lean-home "$(lean --print-prefix)" --mathlib .lake/packages/mathlib --out "${RUNNER_TEMP}/nesterov-subcritical-verification"
          elif [[ '${{ matrix.package }}' == 'artin-schreier-depth' ]]; then
            lake build Cli
            python3 scripts/verify_cached.py --mathlib-cache .lake/packages/mathlib --lean-bin "$(lean --print-prefix)/bin/lean" --packages-root .lake/packages --output "${RUNNER_TEMP}/artin-schreier-depth-verification"
          elif [[ '${{ matrix.package }}' == 'unit-squareclasses' ]]; then
            python3 scripts/verify_cached.py --mathlib-cache .lake/packages/mathlib --lean-bin "$(lean --print-prefix)/bin/lean" --packages-root .lake/packages --output "${RUNNER_TEMP}/unit-squareclasses-verification"
          elif [[ '${{ matrix.package }}' == 'keller-klein' ]]; then
            python3 verify.py --lean "$(lean --print-prefix)/bin/lean" --mathlib .lake/packages/mathlib
          elif [[ '${{ matrix.package }}' == 'matrix-pencil-completion' ]]; then
            command -v rg >/dev/null || { sudo apt-get update && sudo apt-get install --yes ripgrep; }
            bash verify.sh
            lake build MatCP1
            lake env lean ../lean_p1/AxiomAudit.lean | tee "${RUNNER_TEMP}/matrix-pencil-cancellation-axioms.log"
            python3 -c "import re,sys; t=open(sys.argv[1]).read(); bad=[a for a in re.findall(r'depends on axioms: \\[([^\\]]*)\\]', t) for a in [s.strip() for s in a.split(',')] if a not in ('propext','Classical.choice','Quot.sound')]; sys.exit(1 if bad or 'error:' in t or 'depends on axioms' not in t else 0)" "${RUNNER_TEMP}/matrix-pencil-cancellation-axioms.log"
            if rg -n '\b(sorry|admit|axiom|native_decide)\b' ../lean_p1/MatCP1.lean ../lean_p1/MatCP1; then exit 1; fi
          elif [[ '${{ matrix.package }}' == 'upper-ppt-hierarchy' ]]; then
            python3 verify_release.py --lean-home "$(lean --print-prefix)" --mathlib .lake/packages/mathlib --packages-dir .lake/packages --out "${RUNNER_TEMP}/upper-ppt-hierarchy-verification"
          elif [[ '${{ matrix.package }}' == 'binary-spectral-tile' ]]; then
            python3 verify_release.py --lean-home "$(lean --print-prefix)" --mathlib .lake/packages/mathlib --packages-dir .lake/packages --out "${RUNNER_TEMP}/binary-spectral-tile-verification"
          elif [[ '${{ matrix.package }}' == 'upb-tensor-rank' ]]; then
            python3 verify.py
          elif [[ '${{ matrix.package }}' == 'critical-hardcore' ]]; then
            python3 verify.py --lean "$(lean --print-prefix)/bin/lean" --mathlib .lake/packages/mathlib
          elif [[ '${{ matrix.package }}' == 'chambolle-pock-cycles' ]]; then
            python3 verify_lean.py --mathlib .lake/packages/mathlib --lean "$(lean --print-prefix)/bin/lean" --output "${RUNNER_TEMP}/chambolle-pock-verification"
          elif [[ '${{ matrix.package }}' == 'admm-counterexample' ]]; then
            python3 verify_lean.py --lean "$(lean --print-prefix)/bin/lean" --mathlib .lake/packages/mathlib --output "${RUNNER_TEMP}/admm-source-verification"
          else
            python3 -B check_package.py
            python3 -B test_verify.py
            python3 verify.py
          fi
