name: Source, manuscripts, and Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Check source, hashes, and metadata
        run: |
          python verification/check_repository.py
          python verification/check_embedded_packages.py --arithmetic
          python verification/verify_hashes.py
          python verification/validate_metadata.py
          python verification/validate_citations.py
          python lean/scripts/check-lean-sources.py
          python verification/check_gyires_certificates.py
          python verification/check_gyires_packages.py
      - name: Check certificate failures and publication boundaries
        run: |
          python -m unittest discover -s verification -p 'test_*.py'
          python verification/additional-proofs/readk-covariance/scripts/test_verifiers.py
          python verification/additional-proofs/thermal-kurtosis-counterexample/test_verifiers.py

  manuscripts:
    name: Manuscript builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c
        with:
          tectonic-version: '0.17.0'
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Build each manuscript and compare its text with the committed PDF
        run: python3 verification/check_manuscripts.py

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          build-args: MathAndTheory Solutions Challenges
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check the stated types and permitted axioms
        working-directory: lean
        run: lake env lean Audit.lean

  readk-lean-419:
    name: Read-k Lean 4.19 build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Copy the unchanged release package
        run: |
          mkdir -p .ci-work
          cp -R verification/additional-proofs/readk-covariance .ci-work/readk-covariance
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .ci-work/readk-covariance
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Check dependencies, compile proofs, and check axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/check_ci_workcopy.py readk verification/additional-proofs/readk-covariance .ci-work/readk-covariance
          (cd .ci-work/readk-covariance && bash verify.sh)
          python3 .ci-work/readk-covariance/scripts/test_verifiers.py
          python3 verification/check_ci_workcopy.py readk verification/additional-proofs/readk-covariance .ci-work/readk-covariance

  thermal-lean-419:
    name: Thermal Lean 4.19 build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: leanprover-community/mathlib4
          ref: c44e0c8ee63ca166450922a373c7409c5d26b00b
          path: .ci-work/mathlib4
          persist-credentials: false
      - name: Copy the unchanged release package
        run: cp -R verification/additional-proofs/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: .ci-work/mathlib4
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Get the cache for the proof imports
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t imports < <(python3 - <<'PY'
          from pathlib import Path
          source = Path('.ci-work/thermal-kurtosis-counterexample/ThermalKurtosis.lean').read_text()
          for line in source.splitlines():
              if line.startswith('import Mathlib.'):
                  print(line.removeprefix('import ').replace('.', '/') + '.lean')
          PY
          )
          test "${#imports[@]}" -eq 20
          (cd .ci-work/mathlib4 && lake exe cache get "${imports[@]}")
      - name: Compile, check exact arithmetic, and check axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 verification/check_ci_workcopy.py thermal verification/additional-proofs/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample
          bash .ci-work/thermal-kurtosis-counterexample/verify.sh "$PWD/.ci-work/mathlib4" 2>&1 | tee "$RUNNER_TEMP/thermal-verify.log"
          python3 verification/check_embedded_packages.py --thermal-log "$RUNNER_TEMP/thermal-verify.log"
          python3 .ci-work/thermal-kurtosis-counterexample/test_verifiers.py
          python3 verification/check_ci_workcopy.py thermal verification/additional-proofs/thermal-kurtosis-counterexample .ci-work/thermal-kurtosis-counterexample

  study-proofs:
    name: Study proof — ${{ matrix.study }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.study == 'higuchi-sudbery' && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        study:
          - sharp-eighth
          - universal-embezzlement
          - galvin-zhang
          - asymmetric-tutte
          - higuchi-sudbery
          - quartic-rankings
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: verification/additional-proofs/${{ matrix.study }}
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check all requested theorem reports
        env:
          STUDY_NAME: ${{ matrix.study }}
          LEAN_NUM_THREADS: '1'
        run: |
          python3 verification/run_study_audit.py "$STUDY_NAME" "$RUNNER_TEMP/study-audit.txt"
          if [ "$STUDY_NAME" = "higuchi-sudbery" ]; then
            python3 verification/additional-proofs/higuchi-sudbery/tools/audit_sos.py
          fi
          git diff --exit-code


  gyires-rank-two:
    name: Gyires rank-two Lean proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LEAN_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: verification/gyires-rank-two
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
          use-github-cache: 'false'
      - name: Compile all sources and check the final theorem
        working-directory: verification/gyires-rank-two
        run: |
          python3 check_package.py
          python3 -B test_verify.py
          python3 verify.py
          rank_lean="$(elan which lean)"
          rank_dependencies="$(lake env printenv LEAN_PATH)"
          LEAN_PATH="$PWD/.verification/build:$rank_dependencies" "$rank_lean" \
            --trust=0 -j1 -M8192 -DwarningAsError=true -R ../gyires-rank-two-seven-audit \
            ../gyires-rank-two-seven-audit/RankTwoSevenScopedAudit.lean \
            > ../gyires-rank-two-seven-audit/audit.log
          python3 ../gyires-rank-two-seven-audit/check_audit.py ../gyires-rank-two-seven-audit/audit.log
          git diff --exit-code
