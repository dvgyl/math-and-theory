name: Source, manuscripts, and Lean

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: verification/requirements.txt
      - run: python -m pip install -r verification/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Check source, hashes, and metadata
        run: |
          python verification/check_repository.py
          python verification/verify_hashes.py
          python verification/validate_metadata.py
          python lean/scripts/check-lean-sources.py
          python verification/check_gyires_certificates.py
      - name: Check certificate failures and publication boundaries
        run: python -m unittest discover -s verification -p 'test_*.py'

  manuscripts:
    name: Manuscript builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: wtfjoke/setup-tectonic@5e1ba6e10229bd876c6594189bdab1a62b9d0b1c
        with:
          tectonic-version: '0.17.0'
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Build each manuscript and compare its text with the committed PDF
        shell: bash
        run: |
          set -euo pipefail
          build_root=$(mktemp -d)
          count=0
          for source in overview.tex preprints/*/paper.tex; do
            count=$((count + 1))
            output="$build_root/$count"
            mkdir -p "$output"
            tectonic -X compile "$source" --outdir "$output" --keep-logs
            if grep -Ei 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined|Overfull|Missing character' "$output"/*.log; then
              echo "Manuscript check failed for $source" >&2
              exit 1
            fi
            pdf=$(basename "${source%.tex}.pdf")
            pdftotext -layout "$output/$pdf" "$output/rebuilt.txt"
            pdftotext -layout "${source%.tex}.pdf" "$output/committed.txt"
            test -s "$output/rebuilt.txt"
            diff -u "$output/committed.txt" "$output/rebuilt.txt"
          done
          test "$count" -eq 8

  lean:
    name: Lean build and axiom audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        env:
          LEAN_NUM_THREADS: '1'
        with:
          lake-package-directory: lean
          auto-config: 'false'
          build: 'true'
          build-args: MathAndTheory Solutions Challenges
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Check the stated types and permitted axioms
        working-directory: lean
        run: lake env lean Audit.lean
