name: Full separate Gyires proofs

on:
  workflow_dispatch:
    inputs:
      package:
        description: Formal package to rebuild from source
        required: true
        type: choice
        options:
          - circulant-six
          - permutation-polynomial
          - rank-two

permissions:
  contents: read

jobs:
  full-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          lake-package-directory: papers/mathematics/gyires/formalization/${{ inputs.package }}
          auto-config: 'false'
          build: 'false'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'true'
      - name: Rebuild every listed source and check its axioms
        working-directory: papers/mathematics/gyires/formalization/${{ inputs.package }}
        env:
          LEAN_NUM_THREADS: '1'
        run: python3 verify.py
