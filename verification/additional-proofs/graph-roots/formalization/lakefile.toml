name = "graphRootsComplete"
version = "1.0.0"
defaultTargets = ["GraphRootsComplete"]
moreLeanArgs = ["-j1", "-DwarningAsError=true"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[lean_lib]]
name = "GraphRootsComplete"
srcDir = "src"
roots = ["CompleteAudit"]
globs = ["LambertCenter", "UniformInverse", "SmallZero", "UniformSmallZero", "LambertSequence", "SquareFlowerLambert", "LambertGrowth", "ReciprocalLog", "UniformLog", "LambertScale", "ReciprocalModel", "ReciprocalPrefactor", "DerivativeA", "UniformExp", "TransferLimitA", "DerivativeLimitA", "DerivativeB", "DerivativeLimitB", "TransferLimitB", "TransferRoots", "FlowerGraph", "FlowerDomination", "FlowerCounting", "FlowerPolynomial", "GraphReturn", "RootScale", "ExtremalRadius", "NonzeroRoots", "RadiusAlgebra", "RadiusLog", "RadiusActual", "ExtremalSqueeze", "GraphDegree", "RadiusExactAlgebra", "PositiveLambert", "RadiusExact", "SharpRadius", "RadiusEquivalent", "PositiveLambertAsymptotic", "RealExclusions", "MainTheorem", "StatementAudit", "CompleteAudit", "BookBasicRoots", "BookCounting", "BookDomination", "BookGraph", "BookInnerCalculus", "BookInnerExistence", "BookInnerShape", "BookInnerSimplicity", "BookInnerWitnesses", "BookInnerZeros", "BookNegative", "BookOrigin", "BookOuterCalculus", "BookOuterRoots", "BookOuterSimplicity", "BookPolynomial", "BookRealRootCount", "BookRootClassification", "EvenRoots", "EvenShape", "EvenSimplicity", "NonzeroRootCount", "RootEndpointExpansion", "RootEndpointScale", "RootLogErrors", "RootMotion", "RootPowerErrors"]
