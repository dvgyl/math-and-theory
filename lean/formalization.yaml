  - source: An entropy increase for a structurally disassortative DomiRank graph; principal
      statement counterexample
    lean: DomiRankProblem.counterexample
    module: Solutions.DomiRank
    status: proved
    note: A connected graph with 14 vertices and 32 edges has negative degree–log-degree edge
      covariance. All resolvent scores are positive on [251/1000,63/250] inside the stable
      domain. Its entropy nevertheless increases by more than 1/10000 in natural-logarithm
      units. This refutes the source’s assertion for every positive-score interval. The family
      documentation gives the declaration-level correspondence.
  - source: Diagonal concavity does not imply concavity for sums of elementary symmetric polynomials;
      principal statement result
    lean: ConcavityChallenge.result
    module: Solutions.DiagonalConcavity
    status: proved
    note: For positive M, let f=1+Mσ₁+σ₂+Mσ₃+σ₄ in four variables. Its fourth root is concave
      on the positive diagonal exactly when M≥1. It is concave on the full positive orthant
      exactly when M=1. Every M>1 therefore disproves Lachaume’s diagonal criterion with strictly
      positive coefficients. The family documentation gives the declaration-level correspondence.
  - source: Sharp root log-concavity of alternating Motzkin sums; principal statement source_defined_result
    lean: MathAndTheory.Motzkin.Palomar.source_defined_result
    module: Solutions.Motzkin
    status: proved
    note: Let Tₙ be the alternating sum of Motzkin numbers through index n. The sequence Tₙ^(1/n)
      is strictly log-concave on its tail starting at five. The inequality reverses at center
      five, so no earlier tail is log-concave. This strengthens Zhao’s proposed tail starting
      at nine. The source recurrence and finite sum are linked in Lean. The family documentation
      gives the declaration-level correspondence.
  - source: A uniform counterexample family for late iterates of generalized Hofstadter functions;
      principal statement result
    lean: HofstadterChallenge.result
    module: Solutions.Hofstadter
    status: proved
    note: For every k≥4, some input n satisfies Fₖ^(2k+1)(n)>Fₖ₊₁^(2k+2)(n). The proof constructs
      inverse iterates whose exact gap is k−3. The finite witness F₄⁹(132)=8>7=F₅¹⁰(132) gives
      the first instance. The result concerns infinitely many parameters, not infinitely many
      violating inputs for each fixed parameter. The family documentation gives the declaration-level
      correspondence.
  - source: Counterexamples to a best-of-n win-rate bound at every budget; principal statement
      result
    lean: BestOfNChallenge.result
    module: Solutions.BestOfN
    status: proved
    note: For every n≥2 and δ>0, there is a finite positive reference distribution whose largest
      atom is at most δ and whose best-of-n policy violates the proposed divergence–win-rate
      curve. A four-response best-of-two example gives exact probabilities and a strict logarithmic
      certificate. The proof uses finite interval bounds and gives a quantitative positive
      gap. It does not determine the sharp replacement curve. The family documentation gives
      the declaration-level correspondence.
