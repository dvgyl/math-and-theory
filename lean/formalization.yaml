fidelity:
  divergences: DomiRank uses natural logarithms in its quantified gap; the formal development
    proves the base-two entropy implication. Motzkin uses the source recurrence and proves
    equality with the source finite alternating sum. Best-of-n uses the source finite cumulative-probability
    law; the all-budget construction uses explicitly stated sufficient constants. The selected
    Gyires formal statements cover order-five circulants, all-order four-block matrices, and
    the exceptional-vector family in orders n ≥ 2.
    The other principal Gyires manuscript results are not fully formalized. Q-permanent retains
    the full coordinate order when counting inversions. Hofstadter uses the original recurrence
    and proves the inverse correspondence. Concavity uses unnormalized elementary symmetric
    polynomials and actual real fourth roots.
